services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: garanti
      POSTGRES_PASSWORD: garanti
      POSTGRES_DB: garanti
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garanti -d garanti"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.2-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.1.0
    command: ["server"]
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage-data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://garanti:garanti@postgres:5432/garanti
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: local-dev-change-me-32-bytes-minimum
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://garanti:garanti@postgres:5432/garanti
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: local-dev-change-me-32-bytes-minimum
      WORKER_HTTP_PORT: 3001
      METRICS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

  migrator:
    build:
      context: .
      dockerfile: apps/migrator/Dockerfile
    environment:
      DATABASE_URL: postgres://garanti:garanti@postgres:5432/garanti
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-postgres://garanti:garanti@postgres:5432/garanti}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres-data:
  redis-data:
  garage-data:
