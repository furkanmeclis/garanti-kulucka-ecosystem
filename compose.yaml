services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: garanti
      POSTGRES_PASSWORD: garanti
      POSTGRES_DB: garanti
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garanti -d garanti"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.2-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.1.0
    command: ["server"]
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage-data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    stop_grace_period: 30s
    environment:
      APP_ENV: local
      PORT: 3000
      API_SHUTDOWN_TIMEOUT_MS: 25000
      DATABASE_URL: postgres://garanti:garanti@postgres:5432/garanti
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: local-dev-change-me-32-bytes-minimum
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
      # Internal metrics listener; only the monitoring profile's Prometheus scrapes it (no host port).
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: 9464
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    stop_grace_period: 45s
    environment:
      APP_ENV: local
      WORKER_SHUTDOWN_TIMEOUT_MS: 40000
      DATABASE_URL: postgres://garanti:garanti@postgres:5432/garanti
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: local-dev-change-me-32-bytes-minimum
      WORKER_HTTP_PORT: 3001
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

  beta-frontend:
    build:
      context: .
      dockerfile: apps/web-beta/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_started

  migrator:
    build:
      context: .
      dockerfile: apps/migrator/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://garanti:garanti@postgres:5432/garanti
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-postgres://garanti:garanti@postgres:5432/garanti}
      # Command reports also go to the worker's migration-reports queue (best effort).
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  # Monitoring profile: METRICS_ENABLED=true docker compose --profile monitoring up
  # (docs/operations/MONITORING_STACK.md). UIs bind to 127.0.0.1 only.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager
    profiles:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DEFAULT_TIMEZONE: Europe/Istanbul
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  postgres-data:
  redis-data:
  garage-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
