name: Build and Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-and-tag-main
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Compute next tag
        id: next_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$latest_tag" ]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            patch=$((patch + 1))
            next_tag="v${major}.${minor}.${patch}"
          fi

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists."
          fi

          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Package container image artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          next_tag="${{ steps.next_tag.outputs.next_tag }}"
          image_root="ghcr.io/${{ github.repository }}"
          mkdir -p artifacts

          docker tag garanti-kulucka-api:local "$image_root/api:$next_tag"
          docker tag garanti-kulucka-worker:local "$image_root/worker:$next_tag"
          docker tag garanti-kulucka-migrator:local "$image_root/migrator:$next_tag"
          docker tag garanti-kulucka-web:local "$image_root/web:$next_tag"

          docker save "$image_root/api:$next_tag" | gzip > "artifacts/garanti-kulucka-api-$next_tag.tar.gz"
          docker save "$image_root/worker:$next_tag" | gzip > "artifacts/garanti-kulucka-worker-$next_tag.tar.gz"
          docker save "$image_root/migrator:$next_tag" | gzip > "artifacts/garanti-kulucka-migrator-$next_tag.tar.gz"
          docker save "$image_root/web:$next_tag" | gzip > "artifacts/garanti-kulucka-web-$next_tag.tar.gz"

      - name: Upload container image artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: container-images-${{ steps.next_tag.outputs.next_tag }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Create next tag
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          next_tag="${{ steps.next_tag.outputs.next_tag }}"
          git fetch --tags --force

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          git push origin "$next_tag"
