metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
# Local development only: Garage requires 32 bytes of hex (`openssl rand -hex 32`). Replace in every real deployment.
rpc_secret = "6c6f63616c2d6465762d6761726167652d7270632d7365637265742d30303031"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "local-dev-garage-admin-token-change-me"
metrics_token = "local-dev-garage-metrics-token-change-me"
